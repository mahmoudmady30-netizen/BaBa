org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.9.0 was tested up to compileSdk 35; this project targets 36 to
# meet Google Play's upcoming requirement. The warning is informational
# only (compilation works fine) — this suppresses it per AGP's own
# suggested fix, rather than forcing a further, less-certain AGP bump.
android.suppressUnsupportedCompileSdk=36
